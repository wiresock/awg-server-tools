[book]
title = "WireSock AWG Server Tools"
authors = ["WireSock"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/wiresock/awg-server-tools"
edit-url-template = "https://github.com/wiresock/awg-server-tools/edit/main/docs/{path}"
site-url = "/awg-server-tools/"
no-section-label = true

[output.html.search]
enable = true

[preprocessor.include-map]
# Expand {{#include}} and rewrite relative links/images for the chapter path.
# README.md chapter links become index.html (mdBook's rendered name).
# See mdbook-include-map.py (--check / --check-html). Runs before "links".
command = "python3 docs/mdbook-include-map.py"
before = ["links"]

