name: AI PR review
'on':
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number for a second opinion from Anthropic
        required: true
        type: string

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-ai-pr-review.yml
    with:
      pr: ${{ inputs.pr || '' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
