name: BoringTun Release

# Retired publisher: retain read-only diagnostics for the historical AWG
# release contract. New publication belongs to the BoringTun fork. Removing
# the current publish job does not disable historical workflow reruns; the
# owner must disable this workflow before fork activation (see migration doc).

on:
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: "ID of the successful BoringTun Artifacts run that built the archives"
        required: true
        type: string
      artifacts_commit:
        description: "Full SHA of the reviewed commit that run built (on main)"
        required: true
        type: string
      mode:
        description: "Read-only historical release validation"
        required: true
        type: choice
        options:
          - dry-run
        default: dry-run

permissions: {}

defaults:
  run:
    shell: bash

# One release operation at a time; never cancel one part way.
concurrency:
  group: boringtun-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check every release condition without changing anything
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifacts_run_id }}
          COMMIT: ${{ inputs.artifacts_commit }}
        run: |
          set -o pipefail
          bash scripts/boringtun-release.sh dry-run "$RUN_ID" "$COMMIT" main "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/plan.txt"
          { echo '## BoringTun release dry run'; echo; echo '```'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
