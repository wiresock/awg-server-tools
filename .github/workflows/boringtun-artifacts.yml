name: BoringTun Artifacts

# Consumer checks after moving artifact production to wiresock-boringtun.
# Keep this workflow path for historical provenance identity. Existing release
# bytes and historical attestations are unchanged. This revision cannot build,
# attest or publish a replacement. See docs/BORINGTUN_MIGRATION.md.
on:
  push:
    branches: [main]
    paths: [packaging/boringtun/**, scripts/boringtun-*, tests/test-boringtun-*, .github/workflows/boringtun-artifacts.yml]
  pull_request:
    branches: [main]
    paths: [packaging/boringtun/**, scripts/boringtun-*, tests/test-boringtun-*, .github/workflows/boringtun-artifacts.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: Archive and adoption contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          python3 tests/test-boringtun-notices.py
          python3 tests/test-boringtun-adopt.py
          python3 tests/test-boringtun-public-contract.py
          bash tests/test-boringtun-artifact.sh
          bash tests/test-boringtun-release.sh
      - name: Check the exact release embedded by the installer
        run: bash tests/test-boringtun-public-release.sh
