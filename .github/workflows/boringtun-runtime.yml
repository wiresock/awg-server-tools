name: BoringTun Runtime

# Live test of the supervised BoringTun runtime layer of amneziawg-install.sh
# on a systemd host. The host is provisioned by hand and the test selects the
# runtime in the shell that sources the installer; the installer's own fresh
# install is tested by the BoringTun Host workflow. The binary comes from the
# exact published release and hashes embedded in the installer. This consumer
# never builds, uploads or releases BoringTun artifacts. See
# docs/BORINGTUN_BACKEND_DESIGN.md.

on:
  push:
    branches: [main]
    paths:
      - amneziawg-install.sh
      - packaging/boringtun/**
      - scripts/boringtun-artifact.sh
      - tests/test-boringtun-runtime.sh
      - tests/test-boringtun-runtime-live.sh
      - .github/workflows/boringtun-runtime.yml
  pull_request:
    branches: [main]
    paths:
      - amneziawg-install.sh
      - packaging/boringtun/**
      - scripts/boringtun-artifact.sh
      - tests/test-boringtun-runtime.sh
      - tests/test-boringtun-runtime-live.sh
      - .github/workflows/boringtun-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  runtime:
    name: Supervised BoringTun runtime (systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify the exact published release embedded by the installer
        run: bash tests/test-boringtun-public-release.sh

      - name: Download the verified x86_64 archive for runtime tests
        run: |
          source tests/helpers/boringtun-contracts.sh
          base="$(btc_embedded_value amneziawg-install.sh BASE_URL)"
          asset="$(btc_embedded_value amneziawg-install.sh ASSET_X86_64)"
          expected="$(btc_embedded_value amneziawg-install.sh ARCHIVE_SHA256_X86_64)"
          mkdir -p "$RUNNER_TEMP/dist"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 \
            -o "$RUNNER_TEMP/dist/$asset" "$base/$asset"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/dist/$asset" | sha256sum -c -

      # awg, awg-quick and awg-quick@.service only. --no-install-recommends
      # keeps amneziawg-dkms, and with it the kernel module, off the host.
      - name: Install amneziawg-tools without the kernel module
        run: |
          sudo add-apt-repository -y ppa:amnezia/ppa
          sudo apt-get install -y --no-install-recommends amneziawg-tools iptables python3
          dpkg-query -W amneziawg-tools
          if dpkg-query -W -f='${Status}' amneziawg-dkms 2>/dev/null | grep -q 'install ok installed' || [[ -e /sys/module/amneziawg ]]; then
            echo "::error::the AmneziaWG kernel module must not be present"
            exit 1
          fi

      - name: Compare the PostDown parser with the installed awg-quick
        run: |
          AWG_QUICK_REFERENCE=/usr/bin/awg-quick bash tests/test-boringtun-runtime.sh

      - name: Live supervised runtime test (as root)
        run: |
          sudo env AWG_DISPOSABLE_RUNTIME_TEST=1 bash tests/test-boringtun-runtime-live.sh "$RUNNER_TEMP"/dist/*.tar.gz
